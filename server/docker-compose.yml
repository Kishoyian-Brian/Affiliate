services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: tasklane
      POSTGRES_DB: tasklane
    ports:
      - '5435:5432'
    volumes:
      - tasklane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasklane -d tasklane']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tasklane_pg:
